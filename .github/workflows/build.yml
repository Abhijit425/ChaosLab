name: Build CHAOS LAB APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ChaosLab-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/ChaosLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChaosLab-apk
          path: out/*.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CHAOS LAB build ${{ github.run_number }}
          body: Install **ChaosLab.apk** on your Android tablet (allow installs from unknown sources).
          files: out/*.apk
